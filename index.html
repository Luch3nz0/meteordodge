<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteor Dodge Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div id="sky"></div>
        <div id="ground"></div>
        <div id="timer">Time: 0.0s</div>
        <div id="player"></div>
        <div id="main-menu">
            <h1>Meteor Dodge</h1>
            <button id="normal-mode">Normal Mode</button>
            <button id="mode-2">Mode 2 (Under Construction)</button>
            <button id="mode-3">Mode 3 (Under Construction)</button>
            <button id="skins-button" class="game-button">Skins</button>
        </div>
        <div id="skins-menu" style="display: none;">
            <h2>Skins Collection</h2>
            <div id="skins-grid">
                <div class="skin-item">
                    <div class="skin-preview default-skin" data-skin="default">
                        <div class="skin-square"></div>
                    </div>
                    <p>Default</p>
                </div>
                <div class="skin-item">
                    <div class="skin-preview normal-skin" data-skin="normal">
                        <div class="skin-square"></div>
                    </div>
                    <p>Normal Champion</p>
                </div>
                <div class="skin-item">
                    <div class="skin-preview icy-skin" data-skin="icy">
                        <div class="skin-square"></div>
                    </div>
                    <p>Ice Master</p>
                </div>
                <div class="skin-item">
                    <div class="skin-preview insane-skin" data-skin="insane">
                        <div class="skin-square"></div>
                    </div>
                    <p>Insanity King</p>
                </div>
            </div>
            <button id="back-to-menu" class="game-button">Back to Menu</button>
        </div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-time">You survived: 0.0s</p>
            <p id="best-time">Best time: 0.0s</p>
            <button id="retry-button">Retry</button>
            <button id="menu-button">Back to Menu</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
